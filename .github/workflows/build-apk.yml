name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0
          pip install openpyxl pyzbar pillow pytest python-barcode
      - name: Testes
        run: python -m pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake build-essential ccache

      - name: Instalar Buildozer
        run: pip install buildozer==1.5.0 "cython<3.0"

      # SDK/NDK e builds anteriores: acelera muito as próximas compilações.
      - name: Cache do Buildozer (global)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache do Buildozer (projeto)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}-${{ github.sha }}
          restore-keys: |
            buildozer-project-${{ hashFiles('buildozer.spec') }}-

      - name: Compilar APK (debug)
        run: yes | buildozer -v android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: neoncart-apk
          path: bin/*.apk
          if-no-files-found: error
